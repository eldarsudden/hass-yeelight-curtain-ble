name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p test_release.py -v

      - name: Validate version and build archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/build_release.py --tag "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/yeelight_curtain_ble-${RELEASE_TAG}.zip" \
            "dist/yeelight_curtain_ble-${RELEASE_TAG}.zip.sha256" \
            --verify-tag \
            --title "Yeelight Curtain BLE ${RELEASE_TAG}" \
            --notes-file dist/release-notes.md \
            --latest
